name: E2E API CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  operator-journey:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pytest -q server/tests/test_e2e.py
