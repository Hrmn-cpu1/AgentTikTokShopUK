name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  postgres-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: operator
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tiktok_profit_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U operator -d tiktok_profit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://operator:ci-only-password@localhost:5432/tiktok_profit_ci
      OPERATOR_API_TOKEN: ci-only-operator-token-longer-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r server/requirements.txt
      - name: Download production pt-BR voice
        run: |
          mkdir -p .piper
          python -m piper.download_voices --data-dir .piper pt_BR-faber-medium
          echo "PIPER_MODEL_PATH=$GITHUB_WORKSPACE/.piper/pt_BR-faber-medium.onnx" >> "$GITHUB_ENV"
      - run: python -m compileall -q server
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q server/tests
