name: ASMR Reliability CI

on:
  pull_request:
    paths:
      - 'server/asmr_reels.py'
      - 'server/asmr_volume_bridge.py'
      - 'server/asmr_recovery.py'
      - 'server/tests/test_asmr*.py'
      - '.github/workflows/asmr-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asmr-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-python-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm required FFmpeg binaries are locally installed
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
      - name: Install small isolated test dependency
        run: python -m pip install pytest
      - name: Compile and execute isolated ASMR contracts
        run: |
          python -m compileall -q server/asmr_reels.py server/asmr_volume_bridge.py server/asmr_recovery.py
          python -m pytest -q \
            server/tests/test_asmr_reels.py \
            server/tests/test_asmr_volume_bridge.py \
            server/tests/test_asmr_recovery.py \
            server/tests/test_asmr_crash_recovery.py
